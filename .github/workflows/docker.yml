name: Docker

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: imfwizard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Version and help
        run: |
          docker run --rm imfwizard:ci --version
          docker run --rm imfwizard:ci watch --help

      # ffmpeg and the sources run inside the image, the runner needs nothing
      - name: Build an IMP inside the image
        run: |
          mkdir -p work && chmod 777 work
          docker run --rm -v "$PWD/work:/data" --entrypoint sh imfwizard:ci -c '
            set -e
            ffmpeg -v error -f lavfi -i testsrc2=size=1920x1080:rate=24 -frames:v 12 -pix_fmt yuv420p /data/clip.mp4
            ffmpeg -v error -f lavfi -i anullsrc=r=48000:cl=stereo -t 0.5 /data/clip.wav
            imfwizard create --title DockerCi --video /data/clip.mp4 --audio /data/clip.wav --output /data/out
          '
          test -f work/out/ASSETMAP.xml
          ls work/out

      - name: REST API answers
        run: |
          cid=$(docker run -d --rm -p 127.0.0.1:18081:8081 imfwizard:ci serve --bind 0.0.0.0:8081)
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:18081/api/v1/health && break; sleep 1; done
          curl -fs http://127.0.0.1:18081/api/v1/health
          docker stop "$cid"

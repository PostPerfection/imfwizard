name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-2022
            name: Windows

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libxml2-utils libssl-dev libxerces-c-dev fonts-dejavu-core

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config libxml2 openssl@3 xerces-c

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:VCPKG_BUILD_TYPE="release"
          # vcpkg reads curl 56 and 503 off github's archive host as permanent and
          # refuses to retry the source download, so retry the whole install
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            vcpkg install "libxml2[tools]" openssl xerces-c --triplet x64-windows
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "vcpkg install failed after $attempt attempts" }
            Start-Sleep -Seconds (30 * $attempt)
          }

      - name: Set vcpkg env (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "VCPKG_ROOT=C:/vcpkg" >> $GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
          echo "OPENSSL_DIR=C:/vcpkg/installed/x64-windows" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:/vcpkg/installed/x64-windows/lib" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=C:/vcpkg/installed/x64-windows/include" >> $GITHUB_ENV
          # the libxml2 tools feature installs xmllint.exe here
          echo "C:/vcpkg/installed/x64-windows/tools/libxml2" >> $GITHUB_PATH

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-27-16-45/ffmpeg-n8.1.2-47-g156bb4d299-linux64-gpl-8.1.tar.xz
          tar -xJf ffmpeg.tar.xz
          echo "$PWD/ffmpeg-n8.1.2-47-g156bb4d299-linux64-gpl-8.1/bin" >> "$GITHUB_PATH"

      # homebrew's ffmpeg carries no libass or freetype, which the subtitle burn
      # needs. conda-forge's gpl build enables both.
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: ffmpeg
          create-args: ffmpeg=8.1.1=gpl_h4b93310_102
          init-shell: none

      - name: Put ffmpeg on PATH (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "$(dirname "$("${MAMBA_EXE:-micromamba}" run -n ffmpeg which ffmpeg)")" >> "$GITHUB_PATH"

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-27-16-45/ffmpeg-n8.1.2-47-g156bb4d299-win64-gpl-8.1.zip
          unzip -q ffmpeg.zip
          echo "$(cygpath -w "$PWD/ffmpeg-n8.1.2-47-g156bb4d299-win64-gpl-8.1/bin")" >> "$GITHUB_PATH"

      # the workspace links grok-ffi, so every platform needs this to compile
      - name: Setup grok
        uses: PostPerfection/setup-grok@v1
        with:
          grok-ref: v20.4.2

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Photon
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/photon-jars
          key: photon-${{ runner.os }}-${{ hashFiles('scripts/fetch_photon.sh') }}

      - name: Setup Photon
        shell: bash
        run: |
          workspace="$GITHUB_WORKSPACE"
          if command -v cygpath >/dev/null 2>&1; then
            workspace=$(cygpath -u "$GITHUB_WORKSPACE")
          fi
          bash scripts/fetch_photon.sh "$workspace/photon-jars"
          # java is a native process on Windows and cannot read an MSYS path
          jars="$workspace/photon-jars"
          if command -v cygpath >/dev/null 2>&1; then
            jars=$(cygpath -w "$jars")
          fi
          echo "PHOTON_JAR=$jars" >> "$GITHUB_ENV"
          # dcpdoctor-core reads PHOTON_DIR for its own Photon pass during
          # `validate`. Without it, it clones and gradle-builds Photon itself.
          echo "PHOTON_DIR=$jars" >> "$GITHUB_ENV"

      - name: Check test tools
        shell: bash
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          xmllint --version
          java -version
          test -n "$PHOTON_JAR"
          # the burn shapes text with fontdb, and cosmic-text builds it without
          # the fontconfig feature, so it reads these directories directly
          case "$RUNNER_OS" in
            Linux) font_dir=/usr/share/fonts ;;
            macOS) font_dir=/System/Library/Fonts ;;
            *) font_dir= ;;
          esac
          if [ -n "$font_dir" ]; then
            font=$(find "$font_dir" -type f \( -name '*.ttf' -o -name '*.otf' -o -name '*.ttc' \) -print -quit)
            test -n "$font"
            echo "$font"
          fi

      - name: Install cargo-llvm-cov (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install llvm-tools (Linux)
        if: runner.os == 'Linux'
        run: rustup component add llvm-tools-preview

      - name: Build
        working-directory: rust
        run: cargo build --release

      - name: Test with coverage (Linux)
        if: runner.os == 'Linux'
        working-directory: rust
        run: cargo llvm-cov --lcov --output-path lcov.info

      - name: Coverage summary (Linux)
        if: runner.os == 'Linux'
        working-directory: rust
        run: cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: rust/lcov.info

      - name: Test
        if: runner.os != 'Linux'
        working-directory: rust
        run: cargo test

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        working-directory: rust
        run: cargo fmt -- --check

      - name: CLI smoke test
        shell: bash
        run: |
          ./rust/target/release/imfwizard --version
          ./rust/target/release/imfwizard --help
          ./rust/target/release/imfwizard doctor --json || true

      - name: CLI flags test
        shell: bash
        run: bash tests/cli_flags_test.sh ./rust/target/release/imfwizard

  gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11.8.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libssl-dev libxerces-c-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev xvfb xdotool

      - name: Setup grok
        uses: PostPerfection/setup-grok@v1
        with:
          grok-ref: v20.4.2

      - uses: PostPerfection/setup-libmpv@v1
        with:
          mpv-release: 20260828
          mpv-archive: mpv-dev-x86_64-20260828-git-182fa6ca49.7z

      - name: Build frontend
        working-directory: gui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build CLI sidecar
        working-directory: rust
        run: |
          cargo build --release -p imfwizard-cli
          TRIPLE=$(rustc -vV | grep host | awk '{print $2}')
          cp target/release/imfwizard ../gui/src-tauri/imfwizard-${TRIPLE}

      - name: Test Tauri backend
        working-directory: gui/src-tauri
        run: cargo test

      - name: Clippy Tauri backend
        working-directory: gui/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check Tauri backend
        working-directory: gui/src-tauri
        run: cargo fmt -- --check

      - name: Build the GUI
        # without custom-protocol tauri builds a dev binary that loads the vite
        # dev url instead of the embedded frontend, tauri build turns it on
        run: cargo build --release --manifest-path gui/src-tauri/Cargo.toml --features tauri/custom-protocol

      - uses: astral-sh/setup-uv@v6

      - name: GUI launch test
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            uv run --no-project --with pytest --with python-xlib pytest tests/test_gui.py -q

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-deny

      # advisories left out until the pinned dcpdoctor-core/postkit deps move off
      # quick-xml 0.37 (RUSTSEC dos advisories). don't add an ignore, it hides the vuln.
      - name: Cargo deny
        working-directory: rust
        run: cargo deny check bans licenses sources

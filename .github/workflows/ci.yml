name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-2022
            name: Windows

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libssl-dev libxerces-c-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config libxml2 openssl@3 xerces-c

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:VCPKG_BUILD_TYPE="release"
          vcpkg install libxml2 openssl xerces-c --triplet x64-windows

      - name: Set vcpkg env (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "VCPKG_ROOT=C:/vcpkg" >> $GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
          echo "OPENSSL_DIR=C:/vcpkg/installed/x64-windows" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:/vcpkg/installed/x64-windows/lib" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=C:/vcpkg/installed/x64-windows/include" >> $GITHUB_ENV

      # build grok (jpeg 2000 codec) from source once per tag, cached.
      # provides libgrokj2k on the pkg-config + loader paths and grk_compress on PATH.
      # imfwizard does not link grok-ffi; it runs grk_compress at encode time.
      - name: Cache grok
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/grok-install
          key: grok-${{ runner.os }}-v20.3.6

      - name: Setup grok
        if: runner.os != 'Windows'
        env:
          GROK_TAG: v20.3.6
        run: |
          prefix="$GITHUB_WORKSPACE/grok-install"
          if [ ! -x "$prefix/bin/grk_compress" ]; then
            git clone --depth 1 --recurse-submodules --shallow-submodules --branch "$GROK_TAG" \
              https://github.com/GrokImageCompression/grok.git "$RUNNER_TEMP/grok-src"
            cmake -S "$RUNNER_TEMP/grok-src" -B "$RUNNER_TEMP/grok-build" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
            cmake --build "$RUNNER_TEMP/grok-build" --parallel "$(getconf _NPROCESSORS_ONLN)"
            cmake --install "$RUNNER_TEMP/grok-build"
          fi
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig:$prefix/lib64/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib:$prefix/lib64:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$prefix/lib:$prefix/lib64:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Build
        working-directory: rust
        run: cargo build --release

      - name: Test
        working-directory: rust
        run: cargo test

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        working-directory: rust
        run: cargo fmt -- --check

      - name: CLI smoke test
        if: runner.os != 'Windows'
        run: |
          ./rust/target/release/imfwizard --version
          ./rust/target/release/imfwizard --help
          ./rust/target/release/imfwizard doctor --json || true

      # linux only: the script uses grep -P, which macOS BSD grep lacks
      - name: CLI flags test
        if: runner.os == 'Linux'
        run: bash tests/cli_flags_test.sh ./rust/target/release/imfwizard

  gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11.8.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libssl-dev libxerces-c-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Build frontend
        working-directory: gui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build CLI sidecar
        working-directory: rust
        run: |
          cargo build --release -p imfwizard-cli
          TRIPLE=$(rustc -vV | grep host | awk '{print $2}')
          cp target/release/imfwizard ../gui/src-tauri/imfwizard-${TRIPLE}

      - name: Test Tauri backend
        working-directory: gui/src-tauri
        run: cargo test

      - name: Clippy Tauri backend
        working-directory: gui/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check Tauri backend
        working-directory: gui/src-tauri
        run: cargo fmt -- --check

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-deny

      # advisories left out until the pinned dcpdoctor-core/postkit deps move off
      # quick-xml 0.37 (RUSTSEC dos advisories). don't add an ignore, it hides the vuln.
      - name: Cargo deny
        working-directory: rust
        run: cargo deny check bans licenses sources

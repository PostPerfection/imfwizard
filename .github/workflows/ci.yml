name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-2022
            name: Windows

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libssl-dev libxerces-c-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config libxml2 openssl@3 xerces-c

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:VCPKG_BUILD_TYPE="release"
          # vcpkg reads curl 56 and 503 off github's archive host as permanent and
          # refuses to retry the source download, so retry the whole install
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            vcpkg install libxml2 openssl xerces-c --triplet x64-windows
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "vcpkg install failed after $attempt attempts" }
            Start-Sleep -Seconds (30 * $attempt)
          }

      - name: Set vcpkg env (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "VCPKG_ROOT=C:/vcpkg" >> $GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
          echo "OPENSSL_DIR=C:/vcpkg/installed/x64-windows" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:/vcpkg/installed/x64-windows/lib" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=C:/vcpkg/installed/x64-windows/include" >> $GITHUB_ENV

      # build grok (jpeg 2000 codec) from source once per tag, cached.
      # provides libgrokj2k on the pkg-config + loader paths and grk_compress on PATH.
      # the workspace links grok-ffi, so every platform needs this to compile.
      - name: Cache grok
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/grok-install
          key: grok-${{ runner.os }}-v20.3.10

      - name: Setup grok
        if: runner.os != 'Windows'
        env:
          GROK_TAG: v20.3.10
        run: |
          prefix="$GITHUB_WORKSPACE/grok-install"
          if [ ! -x "$prefix/bin/grk_compress" ]; then
            git clone --depth 1 --recurse-submodules --shallow-submodules --branch "$GROK_TAG" \
              https://github.com/GrokImageCompression/grok.git "$RUNNER_TEMP/grok-src"
            cmake -S "$RUNNER_TEMP/grok-src" -B "$RUNNER_TEMP/grok-build" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" \
              -DGRK_BUILD_CORE_SWIG_BINDINGS=OFF
            cmake --build "$RUNNER_TEMP/grok-build" --parallel "$(getconf _NPROCESSORS_ONLN)"
            cmake --install "$RUNNER_TEMP/grok-build"
          fi
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig:$prefix/lib64/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib:$prefix/lib64:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$prefix/lib:$prefix/lib64:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      # windows: msvc build mirroring grok's own ci (x64 generator, no libcurl);
      # pkgconfiglite provides pkg-config for grokj2k-sys and the runner's LLVM
      # provides libclang for bindgen.
      - name: Setup grok (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GROK_TAG: v20.3.10
        run: |
          # choco puts its shim directory on the machine PATH, which this
          # already-running bash cannot see, so add it by hand
          choco_bin="$(cygpath -u "${ChocolateyInstall:-C:/ProgramData/chocolatey}")/bin"
          export PATH="$choco_bin:$PATH"
          echo "$(cygpath -w "$choco_bin")" >> "$GITHUB_PATH"
          # choco sometimes reports success while installing nothing, so gate
          # the retries on pkg-config actually answering, not choco's exit code
          for attempt in 1 2 3 4 5; do
            pkg-config --version >/dev/null 2>&1 && break
            choco install -y --no-progress --force pkgconfiglite || true
            hash -r
            pkg-config --version >/dev/null 2>&1 && break
            if [ "$attempt" = 5 ]; then
              echo "pkg-config still missing after $attempt pkgconfiglite installs." >&2
              echo "$choco_bin holds:" >&2
              ls -1 "$choco_bin" >&2 || echo "  (no such directory)" >&2
              exit 1
            fi
            sleep $((30 * attempt))
          done
          prefix="$(cygpath -m "$GITHUB_WORKSPACE")/grok-install"
          if [ ! -f "$prefix/bin/grokj2k.dll" ]; then
            git clone --depth 1 --recurse-submodules --shallow-submodules --branch "$GROK_TAG" \
              https://github.com/GrokImageCompression/grok.git "$RUNNER_TEMP/grok-src"
            cmake -S "$RUNNER_TEMP/grok-src" -B "$RUNNER_TEMP/grok-build" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" \
              -DCMAKE_GENERATOR_PLATFORM=x64 -DGRK_ENABLE_LIBCURL=OFF \
              -DGRK_BUILD_PKGCONFIG_FILES=ON -DGRK_BUILD_CORE_SWIG_BINDINGS=OFF
            cmake --build "$RUNNER_TEMP/grok-build" --config Release --parallel 4
            cmake --install "$RUNNER_TEMP/grok-build" --config Release
          fi
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$prefix")\\bin" >> "$GITHUB_PATH"

      # netflix publishes no photon fat jar and attaches no binaries to its
      # releases, so the jars come from maven central. linux only: one platform
      # is enough for an external cross-check.
      - name: Install JDK (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Photon
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/photon-jars
          key: photon-${{ runner.os }}-${{ hashFiles('scripts/fetch_photon.sh') }}

      - name: Setup Photon
        if: runner.os == 'Linux'
        run: |
          bash scripts/fetch_photon.sh "$GITHUB_WORKSPACE/photon-jars"
          echo "PHOTON_JAR=$GITHUB_WORKSPACE/photon-jars" >> "$GITHUB_ENV"
          # dcpdoctor-core reads PHOTON_DIR for its own Photon pass during
          # `validate`. Without it, it clones and gradle-builds Photon itself.
          echo "PHOTON_DIR=$GITHUB_WORKSPACE/photon-jars" >> "$GITHUB_ENV"

      - name: Build
        working-directory: rust
        run: cargo build --release

      - name: Test
        working-directory: rust
        run: cargo test

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        working-directory: rust
        run: cargo fmt -- --check

      - name: CLI smoke test
        if: runner.os != 'Windows'
        run: |
          ./rust/target/release/imfwizard --version
          ./rust/target/release/imfwizard --help
          ./rust/target/release/imfwizard doctor --json || true

      # linux only: the script uses grep -P, which macOS BSD grep lacks
      - name: CLI flags test
        if: runner.os == 'Linux'
        run: bash tests/cli_flags_test.sh ./rust/target/release/imfwizard

  gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11.8.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libssl-dev libxerces-c-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libmpv-dev

      # the tauri backend links grok-ffi through imfwizard-core, so this job
      # needs libgrokj2k on the pkg-config path just like the rust job does.
      - name: Cache grok
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/grok-install
          key: grok-${{ runner.os }}-v20.3.10

      - name: Setup grok
        env:
          GROK_TAG: v20.3.10
        run: |
          prefix="$GITHUB_WORKSPACE/grok-install"
          if [ ! -x "$prefix/bin/grk_compress" ]; then
            git clone --depth 1 --recurse-submodules --shallow-submodules --branch "$GROK_TAG" \
              https://github.com/GrokImageCompression/grok.git "$RUNNER_TEMP/grok-src"
            cmake -S "$RUNNER_TEMP/grok-src" -B "$RUNNER_TEMP/grok-build" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" \
              -DGRK_BUILD_CORE_SWIG_BINDINGS=OFF
            cmake --build "$RUNNER_TEMP/grok-build" --parallel "$(getconf _NPROCESSORS_ONLN)"
            cmake --install "$RUNNER_TEMP/grok-build"
          fi
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig:$prefix/lib64/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib:$prefix/lib64:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Build frontend
        working-directory: gui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build CLI sidecar
        working-directory: rust
        run: |
          cargo build --release -p imfwizard-cli
          TRIPLE=$(rustc -vV | grep host | awk '{print $2}')
          cp target/release/imfwizard ../gui/src-tauri/imfwizard-${TRIPLE}

      - name: Test Tauri backend
        working-directory: gui/src-tauri
        run: cargo test

      - name: Clippy Tauri backend
        working-directory: gui/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check Tauri backend
        working-directory: gui/src-tauri
        run: cargo fmt -- --check

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-deny

      # advisories left out until the pinned dcpdoctor-core/postkit deps move off
      # quick-xml 0.37 (RUSTSEC dos advisories). don't add an ignore, it hides the vuln.
      - name: Cargo deny
        working-directory: rust
        run: cargo deny check bans licenses sources

app-id: com.imfwizard.desktop
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: imfwizard-gui

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --filesystem=/tmp
  - --share=network

modules:
  - name: openjpeg
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://github.com/uclouvain/openjpeg/archive/refs/tags/v2.5.2.tar.gz
        sha256: 90e3896fed910c376aaf79cdd98bdfdaf98c6472efd8e1debf0a854938cbda6a

  - name: asdcplib
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/cinecert/asdcplib/archive/refs/tags/rel_2_13_3.tar.gz
        sha256: d5558cd419c8d46bdc958064cb97f963d1ea793866414c025906ec15033512ed

  - name: imfwizard
    buildsystem: simple
    build-commands:
      - cargo build --release --manifest-path rust/Cargo.toml -p imfwizard-cli
      - install -Dm755 rust/target/release/imfwizard /app/bin/imfwizard
      - install -Dm644 debian/imfwizard.desktop /app/share/applications/com.imfwizard.desktop.desktop
      # flatpak only exports files named after the app id, so the icon key has to match
      - sed -i 's/^Icon=.*/Icon=com.imfwizard.desktop/' /app/share/applications/com.imfwizard.desktop.desktop
      - install -Dm644 gui/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.imfwizard.desktop.png
    sources:
      - type: dir
        path: .
    build-options:
      env:
        CARGO_HOME: /run/build/imfwizard/.cargo

  - name: imfwizard-gui
    buildsystem: simple
    build-commands:
      - cd gui/src-tauri && cargo build --release
      - install -Dm755 gui/src-tauri/target/release/imfwizard-gui /app/bin/imfwizard-gui
    sources:
      - type: dir
        path: .
    build-options:
      env:
        CARGO_HOME: /run/build/imfwizard-gui/.cargo

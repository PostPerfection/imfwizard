[graph]
targets = []
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = [
    # imfwizard, postkit and dcpdoctor are all AGPL-3.0-or-later themselves
    "AGPL-3.0-or-later",
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "CC0-1.0",  # notify
    "MPL-2.0",  # option-ext
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "allow"
allow-git = [
    "https://github.com/PostPerfection/asdcplib-rs",
    "https://github.com/PostPerfection/dcpdoctor",
    "https://github.com/GrokImageCompression/grok",
]

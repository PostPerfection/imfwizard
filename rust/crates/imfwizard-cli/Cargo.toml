[package]
name = "imfwizard-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "IMF Wizard CLI"

[[bin]]
name = "imfwizard"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap_complete = "4"
ctrlc.workspace = true
imfwizard-core = { path = "../imfwizard-core" }
postkit.workspace = true
serde_json.workspace = true
time = { version = "0.3", features = ["formatting"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
postkit-ffmpeg-link-search = { path = "../../../extern/postkit/ffmpeg-link-search" }

[dev-dependencies]
# the App 2E test reads the picture MXF `create` wrote back off disk
asdcplib = { git = "https://github.com/PostPerfection/asdcplib-rs.git", rev = "0a7bdb5a78d4bc7928012d73ecdd6f4273677a97" }
assert_cmd = "2"
# the Dolby Vision fixture takes the level 6 block that carries MaxCLL and MaxFALL
dolby_vision = "3.4"
hound = "3.5.1"
predicates = "3"
tempfile = "3"

[package.metadata.deb]
name = "imfwizard"
maintainer = "Post Perfection <dev@postperfection.com>"
section = "video"
priority = "optional"
# $auto finds no package for the bundled libgrokj2k and drops every dependency
depends = "libc6 (>= 2.39), libssl3t64 (>= 3.0.0), libstdc++6 (>= 13.1), zlib1g (>= 1:1.1.4), libdav1d7, libdrm2, libva2, libva-drm2, libzimg2"
recommends = "ffmpeg, mpv"
# the desktop package installs the same /usr/bin and /usr/lib files
conflicts = "imf-wizard"
replaces = "imf-wizard"
assets = [
    ["target/release/imfwizard", "usr/bin/", "755"],
    ["target/release/libgrokj2k.so.1", "usr/lib/imfwizard/", "644"],
    # sonames of the ffmpeg-mpv-builds v1.0.0 release the workflows pin
    ["target/release/libavcodec.so.62", "usr/lib/imfwizard/", "644"],
    ["target/release/libavfilter.so.11", "usr/lib/imfwizard/", "644"],
    ["target/release/libavformat.so.62", "usr/lib/imfwizard/", "644"],
    ["target/release/libavutil.so.60", "usr/lib/imfwizard/", "644"],
    ["target/release/libswresample.so.6", "usr/lib/imfwizard/", "644"],
    ["target/release/libswscale.so.9", "usr/lib/imfwizard/", "644"],
    ["../../../README.md", "usr/share/doc/imfwizard/README.md", "644"],
    ["../../../CHANGELOG.md", "usr/share/doc/imfwizard/CHANGELOG.md", "644"],
    ["../imfwizard-core/schemas/README.md", "usr/share/doc/imfwizard/SCHEMA-NOTICES.md", "644"],
    ["target/release/THIRD-PARTY-LICENSES-ffmpeg-mpv.txt", "usr/share/doc/imfwizard/THIRD-PARTY-LICENSES-ffmpeg-mpv.txt", "644"],
]
extended-description = """\
IMF Wizard creates valid IMF packages from video sources, image sequences, \
and WAV audio, conforming to SMPTE ST 2067 (App#2E). Features include \
JPEG 2000 encoding, HDR/Dolby Vision support, and platform delivery presets."""

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
version = "1.3.2"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dcpdoctor-core = { git = "https://github.com/PostPerfection/dcpdoctor.git", rev = "1491d0c18f4d23eb5cadf025a95b6889c75fb64f" }
postkit = { path = "../extern/postkit", features = ["grok-ffi"] }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# dcpdoctor-core depends on postkit by git. pointing that at the submodule this
# workspace already builds keeps postkit to one compile instead of two.
[patch."https://github.com/PostPerfection/postkit.git"]
postkit = { path = "../extern/postkit" }


[package]
name = "imfwizard-gui"
version = "1.1.0"
description = "IMF Wizard Desktop GUI"
authors = ["IMF Wizard"]
edition = "2021"

[lib]
name = "imfwizard_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tokio = { version = "1", features = ["time", "rt"] }
postkit = { path = "../../extern/postkit" }
imfwizard-core = { path = "../../rust/crates/imfwizard-core" }

[features]
# Draws the preview inside the app window through libmpv's render API. Off by
# default because it needs libmpv development files at build time. Only takes
# effect on linux, elsewhere it compiles but the spawned player is used.
embedded-preview = ["dep:async-channel", "postkit/libmpv"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
async-channel = { version = "2", optional = true }

# imfwizard-core pulls dcpdoctor-core, which depends on postkit by git. pointing
# that at the submodule this build already compiles keeps postkit to one compile.
[patch."https://github.com/PostPerfection/postkit.git"]
postkit = { path = "../../extern/postkit" }

# Optimize postkit in debug builds (color math is too slow unoptimized)
[profile.dev.package.postkit]
opt-level = 2
